<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Swiss Approval Albania </title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">
<script src="https://unpkg.com/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
  :root {
    --red: #C0392B;
    --dark: #1A1A2E;
    --light: #F8F5F0;
    --border: #DDD5C8;
    --text: #2C2825;
    --muted: #8B7D6B;
    --white: #FFFFFF;
    --success: #27AE60;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--light); color: var(--text); min-height: 100vh; }

  header { background: var(--dark); color: white; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 20px rgba(0,0,0,0.3); }
  .header-inner { max-width: 800px; margin: 0 auto; padding: 10px 24px; display: flex; align-items: center; gap: 16px; }
  .company-logo { display: block; width: 190px; height: auto; max-height: 82px; object-fit: contain; object-position: left center; flex-shrink: 0; }
  .header-text h1 { font-family: 'DM Serif Display', serif; font-size: 18px; font-weight: 400; color: white; line-height: 1.2; }
  .header-text p { font-size: 11px; color: rgba(255,255,255,0.5); letter-spacing: 0.05em; text-transform: uppercase; margin-top: 2px; }

  main { max-width: 800px; margin: 0 auto; padding: 32px 24px 80px; }
  .intro-card { background: var(--white); border: 1px solid var(--border); border-left: 4px solid var(--red); border-radius: 10px; padding: 20px 24px; margin-bottom: 32px; }
  .intro-card h2 { font-family: 'DM Serif Display', serif; font-size: 20px; color: var(--dark); margin-bottom: 6px; }
  .intro-card p { font-size: 14px; color: var(--muted); line-height: 1.6; }

  .form-section { background: var(--white); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 20px; overflow: hidden; }
  .section-header { background: var(--dark); padding: 14px 24px; display: flex; align-items: center; gap: 12px; }
  .section-number { width: 28px; height: 28px; background: var(--red); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; color: white; flex-shrink: 0; }
  .section-title { font-size: 14px; font-weight: 500; color: white; letter-spacing: 0.03em; text-transform: uppercase; }
  .section-body { padding: 24px; }

  .field-grid { display: grid; gap: 20px; }
  .field-grid.two-col { grid-template-columns: 1fr 1fr; }
  @media (max-width: 560px) { .field-grid.two-col { grid-template-columns: 1fr; } main { padding: 20px 16px 80px; } .section-body { padding: 18px; } }

  .field-group { display: flex; flex-direction: column; gap: 6px; }
  label { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  input, select, textarea { font-family: 'DM Sans', sans-serif; font-size: 15px; color: var(--text); background: var(--light); border: 1.5px solid var(--border); border-radius: 8px; padding: 11px 14px; width: 100%; transition: border-color 0.2s, box-shadow 0.2s; outline: none; }
  input:focus, select:focus, textarea:focus { border-color: var(--red); box-shadow: 0 0 0 3px rgba(192,57,43,0.1); background: white; }
  input::placeholder, textarea::placeholder { color: var(--border); }

  .photo-upload-area { border: 2px dashed var(--border); border-radius: 10px; padding: 30px 20px; text-align: center; cursor: pointer; transition: all 0.2s; }
  .photo-upload-area:hover { border-color: var(--red); background: rgba(192,57,43,0.04); }
  .photo-upload-area.has-photo { border-style: solid; border-color: var(--success); background: rgba(39,174,96,0.04); }
  /* Hidden real file input — triggered via JS, NOT overlaid (iOS fix) */
  #foto-input { display: none; }
  .upload-icon { font-size: 32px; margin-bottom: 8px; display: block; }
  .upload-label { font-size: 14px; color: var(--muted); }
  .upload-sub { font-size: 12px; color: var(--border); margin-top: 4px; }
  .btn-choose-photo { display: inline-block; margin-top: 14px; background: var(--dark); color: white; border: none; border-radius: 8px; padding: 10px 22px; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500; cursor: pointer; }
  #photo-preview { margin-top: 16px; display: none; text-align: center; }
  #photo-preview img { max-width: 100%; max-height: 220px; border-radius: 8px; border: 1px solid var(--border); object-fit: contain; }
  .photo-name { font-size: 12px; color: var(--success); margin-top: 8px; font-weight: 500; }
  .btn-remove-photo { display: inline-block; margin-top: 8px; background: none; border: 1px solid var(--border); border-radius: 6px; padding: 4px 12px; font-size: 12px; color: var(--muted); cursor: pointer; }

  .generate-wrap { margin-top: 32px; text-align: center; }
  .btn-generate { background: var(--red); color: white; border: none; border-radius: 12px; padding: 18px 48px; font-family: 'DM Sans', sans-serif; font-size: 16px; font-weight: 600; cursor: pointer; letter-spacing: 0.02em; transition: all 0.2s; box-shadow: 0 4px 16px rgba(192,57,43,0.3); width: 100%; max-width: 400px; }
  .btn-generate:hover { background: #A93226; transform: translateY(-1px); }
  .btn-generate:disabled { background: var(--muted); box-shadow: none; transform: none; cursor: not-allowed; }

  .status-msg { margin-top: 16px; padding: 12px 18px; border-radius: 8px; font-size: 14px; text-align: center; display: none; }
  .status-msg.success { background: rgba(39,174,96,0.1); border: 1px solid var(--success); color: var(--success); }
  .status-msg.error { background: rgba(192,57,43,0.1); border: 1px solid var(--red); color: var(--red); }

  footer { text-align: center; padding: 20px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--border); }
  .required-star { color: var(--red); }
</style>
</head>

<main>
  <div class="intro-card">
    <h2>Zgjidhni Protokollin e Tokezimit :</h2>
    <div class="field-group" style="margin-top:14px">
      <label for="fleta-punes">Protokolli i Tokezimit</label>
      <select id="fleta-punes">
        <option value="tu">Impiant Elektrik ne TU</option>
        <option value="kabine">Kabine Elektrike</option>
        <option value="rrufeprites">Impiant i mbrojtes nga shkarkimet atmosferike</option>
      </select>
    </div>
  </div>

  <div class="form-section">
    <div class="section-header">
      <div class="section-number">1</div>
      <div class="section-title">Të dhënat e Objektit</div>
    </div>
    <div class="section-body">
      <div class="field-grid">
        <div class="field-group">
          <label for="objekti">Emri i Objektit <span class="required-star">*</span></label>
          <input type="text" id="objekti" placeholder="p.sh. Antena AMC TOWER " />
        </div>
        <div class="field-group">
          <label for="adresa">Adresa e Subjektit <span class="required-star">*</span></label>
          <input type="text" id="adresa" placeholder="p.sh. Tiranë" />
        </div>
        <div class="field-group">
          <label for="subjekti">Emërtimi i Operatorit Ekonomik <span class="required-star">*</span></label>
          <input type="text" id="subjekti" value="One Albania Sha" />
        </div>
      </div>
    </div>
  </div>

  <div class="form-section">
    <div class="section-header">
      <div class="section-number">2</div>
      <div class="section-title">Të dhënat e Inxhinierit</div>
    </div>
    <div class="section-body">
      <div class="field-grid two-col">
        <div class="field-group">
          <label for="inxhinieri">Inxhinieri që kreu matjen <span class="required-star">*</span></label>
          <input type="text" id="inxhinieri" value="Kristi Braushi" />
        </div>
        <div class="field-group">
          <label for="data">Data e Inspektimit <span class="required-star">*</span></label>
          <input type="date" id="data" />
        </div>
        <div class="field-group">
          <label for="temperatura">Temperatura e Ambjentit (°C) <span class="required-star">*</span></label>
          <input type="number" id="temperatura" placeholder="p.sh. 22" step="0.1" />
        </div>
        <div class="field-group">
          <label for="rezistenca">Vlera e Rezistencës së Tokëzimit (Ω) <span class="required-star">*</span></label>
          <input type="text" id="rezistenca" placeholder="p.sh. 0.33 " />
        </div>
        <div class="field-group">
          <label for="instrumenti">Emri i Instrumentit të Matjes <span class="required-star">*</span></label>
          <select id="instrumenti">
            <option value="Megger DET4TCR2">Megger DET4TCR2</option>
            <option value="Metrel MI 3155 EurotestXD">Metrel MI 3155 EurotestXD</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <div class="form-section">
    <div class="section-header">
      <div class="section-number">3</div>
      <div class="section-title">Foto e Matjes</div>
    </div>
    <div class="section-body">
      <div class="photo-upload-area" id="upload-area" onclick="document.getElementById('foto-input').click()">
        <!-- Hidden input triggered by JS click — iOS Safari compatible -->
        <input type="file" id="foto-input" accept="image/*,image/heic,image/heif" onchange="handlePhoto(this)" />
        <span class="upload-icon">📷</span>
        <div class="upload-label">Klikoni për të ngarkuar foto ose fotografoni direkt</div>
        <div class="upload-sub">PNG, JPG, JPEG, HEIC • Max 10MB</div>
        <button class="btn-choose-photo" type="button" onclick="event.stopPropagation(); document.getElementById('foto-input').click()">Zgjidh Foto</button>
      </div>
      <div id="photo-preview">
        <img id="preview-img" src="" alt="Foto e ngarkuar" />
        <div class="photo-name" id="photo-name-label"></div>
      </div>
    </div>
  </div>

  <div class="generate-wrap">
    <button class="btn-generate" id="gen-btn" onclick="generateDoc()">
      📄 Gjenero & Shkarko Protokollin (.docx)
    </button>
    <div class="status-msg" id="status-msg"></div>
  </div>
</main>

// ── Photo state ───────────────────────────────────────────────────────────────
let photoFile   = null;
let photoBase64 = null;
let photoExt    = 'jpg';

function getExifOrientation(buffer) {
  const view = new DataView(buffer);
  if (view.getUint16(0, false) !== 0xFFD8) return 1;
  let offset = 2;
  while (offset < buffer.byteLength) {
    const marker = view.getUint16(offset, false);
    offset += 2;
    if (marker === 0xFFE1) {
      if (view.getUint32(offset + 2, false) !== 0x45786966) return 1;
      const little = view.getUint16(offset + 8, false) === 0x4949;
      const ifdOffset = offset + 8 + view.getUint32(offset + 12, little);
      const entries = view.getUint16(ifdOffset, little);
      for (let i = 0; i < entries; i++) {
        if (view.getUint16(ifdOffset + 2 + i * 12, little) === 0x0112) {
          return view.getUint16(ifdOffset + 2 + i * 12 + 8, little);
        }
      }
      return 1;
    }
    if ((marker & 0xFF00) !== 0xFF00) break;
    offset += view.getUint16(offset, false);
  }
  return 1;
}

function handlePhoto(input) {
  const file = input.files[0];
  if (!file) return;

  const mime = (file.type || '').toLowerCase();
  photoExt = mime.includes('png') ? 'png' : 'jpg';
  photoFile = file;

  const url = URL.createObjectURL(file);
  const img = new Image();

  img.onload = function() {
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');

    // Keep the same orientation the browser shows on screen.
    // This avoids double-rotating phone photos that already have EXIF orientation.
    const w = img.naturalWidth || img.width;
    const h = img.naturalHeight || img.height;
    canvas.width = w;
    canvas.height = h;

    ctx.drawImage(img, 0, 0, w, h);
    URL.revokeObjectURL(url);

    const correctedUrl = canvas.toDataURL(photoExt === 'png' ? 'image/png' : 'image/jpeg', 0.92);
    photoBase64 = correctedUrl.split(',')[1];

    document.getElementById('preview-img').src = correctedUrl;
    document.getElementById('photo-name-label').innerHTML =
      '\u2713 ' + file.name +
      ' <button class="btn-remove-photo" type="button" onclick="removePhoto()">Hiq</button>';
    document.getElementById('photo-preview').style.display = 'block';
    document.getElementById('upload-area').classList.add('has-photo');
  };

  img.onerror = function() {
    URL.revokeObjectURL(url);
    showStatus('\u274C Nuk mund t\u00eb lexohet foto. Provo s\u00ebrish.', 'error');
  };

  img.src = url;
}

function removePhoto() {
  photoFile   = null;
  photoBase64 = null;
  document.getElementById('foto-input').value = '';
  document.getElementById('photo-preview').style.display = 'none';
  document.getElementById('upload-area').classList.remove('has-photo');
}

function showStatus(msg, type) {
  const el = document.getElementById('status-msg');
  el.textContent = msg;
  el.className   = 'status-msg ' + type;
  el.style.display = 'block';
}

function formatDate(dateStr) {
  if (!dateStr) return '';
  const [y, m, d] = dateStr.split('-');
  return d + '.' + m + '.' + y;
}

// Escape special XML characters in user input
function xmlEsc(s) {
  return s.replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&apos;');
}

  const btn = document.getElementById('gen-btn');

  const objekti    = document.getElementById('objekti').value.trim();
  const adresa     = document.getElementById('adresa').value.trim();
  const subjekti   = document.getElementById('subjekti').value.trim();
  const inxhinieri = document.getElementById('inxhinieri').value.trim();
  const dataRaw    = document.getElementById('data').value;
  const temperatura= document.getElementById('temperatura').value.trim();
  const rezistenca = document.getElementById('rezistenca').value.trim();
  const instrumenti= document.getElementById('instrumenti').value;

  if (!objekti || !adresa || !subjekti || !inxhinieri || !dataRaw || !temperatura || !rezistenca || !instrumenti) {
    showStatus('⚠️ Ju lutem plotësoni të gjitha fushat e shënuara me *', 'error');
    return;
  }

  btn.disabled   = true;
  btn.textContent = '⏳ Duke gjeneruar...';

  try {
    // 1. Decode the selected work-sheet template
    const selectedSheet = document.getElementById('fleta-punes').value;
    const templateB64 = TEMPLATES[selectedSheet] || TEMPLATES.tu;
    const binStr  = atob(templateB64);
    const bytes   = new Uint8Array(binStr.length);
    for (let i = 0; i < binStr.length; i++) bytes[i] = binStr.charCodeAt(i);

    // 2. Load with JSZip
    const zip = await JSZip.loadAsync(bytes);

    // 3. Edit document.xml — replace placeholders
    const docFile = zip.file('word/document.xml');
    let   xml     = await docFile.async('string');

    // Inject missing DrawingML namespaces into root element (required for image embedding)
    if (!xml.includes('xmlns:a=')) {
      xml = xml.replace(
        '<w:document ',
        '<w:document xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture" '
      );
    }

    const dateFormatted = formatDate(dataRaw);

    const replacements = {
      '<Objekti>': objekti, '<objekti>': objekti,
      '<Emri i Inxhinierit>': inxhinieri,
      '<Emri i subjektit>': subjekti,
      '<Subjekti>': subjekti, '<subjekti>': subjekti,
      '<Adresa e subjektit>': adresa, '<Adresa>': adresa, '<adresa>': adresa,
      '<Data e Inspektimit>': dateFormatted, '<Data>': dateFormatted, '<data>': dateFormatted,
      '<Temperatura e ambjentit>': temperatura, '<temp>': temperatura,
      '<Vlera e rezistences se tokezimit>': rezistenca, '<vlera>': rezistenca,
      '<Instrumenti>': instrumenti, '<Instrumenti >': instrumenti,
      '<emri>': inxhinieri, '<Emri>': inxhinieri
    };

    // Replace placeholders even when Word split them across multiple text runs.
    function replaceParagraphText(xmlText, replacementsMap) {
      const doc = new DOMParser().parseFromString(xmlText, 'application/xml');
      const wNs = 'http://schemas.openxmlformats.org/wordprocessingml/2006/main';
      const paragraphs = Array.from(doc.getElementsByTagNameNS(wNs, 'p'));
      for (const paragraph of paragraphs) {
        for (const [needle, replacement] of Object.entries(replacementsMap)) {
          while (true) {
            const nodes = Array.from(paragraph.getElementsByTagNameNS(wNs, 't'));
            const joined = nodes.map(n => n.textContent || '').join('');
            const at = joined.indexOf(needle);
            if (at < 0) break;
            let pos = 0, first = -1, last = -1, firstOffset = 0, lastOffset = 0;
            for (let i = 0; i < nodes.length; i++) {
              const next = pos + (nodes[i].textContent || '').length;
              if (first < 0 && at < next) { first = i; firstOffset = at - pos; }
              if (first >= 0 && at + needle.length <= next) {
                last = i; lastOffset = at + needle.length - pos; break;
              }
              pos = next;
            }
            if (first < 0 || last < 0) break;
            const firstText = nodes[first].textContent || '';
            const lastText = nodes[last].textContent || '';
            if (first === last) {
              nodes[first].textContent = firstText.slice(0, firstOffset) + replacement + firstText.slice(lastOffset);
            } else {
              nodes[first].textContent = firstText.slice(0, firstOffset) + replacement;
              for (let i = first + 1; i < last; i++) nodes[i].textContent = '';
              nodes[last].textContent = lastText.slice(lastOffset);
            }
          }
        }
      }
      return new XMLSerializer().serializeToString(doc);
    }

    xml = replaceParagraphText(xml, replacements);
    if (selectedSheet === 'tu') {
      xml = replaceParagraphText(xml, {
        'Inspektori që kreu matjen :': 'Inxhinieri që kreu matjen :',
        'Matjen e kreu Inspektori :': 'Matjen e kreu : Ing. '
      });
    }

 // 4. Handle photo
if (photoFile && photoBase64) {

  // photoExt and photoBase64 are already set by handlePhoto()

  // Save image inside DOCX
  const imgFileName = "word/media/image_foto." + photoExt;
  zip.file(imgFileName, photoBase64, { base64: true });

  // Add relationship
  const relsFile = zip.file("word/_rels/document.xml.rels");
  let relsXml = await relsFile.async("string");

  const newRid = "rId99";

  const relEntry =
    `<Relationship Id="${newRid}"
    Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image"
    Target="media/image_foto.${photoExt}"/>`;

  relsXml = relsXml.replace("</Relationships>", relEntry + "</Relationships>");
  zip.file("word/_rels/document.xml.rels", relsXml);

  // Register content type
  const ctFile = zip.file("[Content_Types].xml");
  let ctXml = await ctFile.async("string");

  const ct = photoExt === "png" ? "image/png" : "image/jpeg";

  if (!ctXml.includes(`Extension="${photoExt}"`)) {
    ctXml = ctXml.replace(
      "</Types>",
      `<Default Extension="${photoExt}" ContentType="${ct}"/></Types>`
    );
    zip.file("[Content_Types].xml", ctXml);
  }

  // Word drawing element — namespaces declared on root (injected above), not inline
  // Dimensions exactly matching the UserPhoto slot in the template docx
  // wp:extent = container box; a:ext = picture shape (slightly larger per template)
  const EXTENT_CX = 5695950;  // 6.23" in EMU
  const EXTENT_CY = 7594599;  // 8.31" in EMU
  const SHAPE_CX  = 5727251;  // template's inner pic shape width
  const SHAPE_CY  = 7636333;  // template's inner pic shape height

  const drawing =
  `<w:r><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0"><wp:extent cx="${EXTENT_CX}" cy="${EXTENT_CY}"/><wp:effectExtent l="0" t="0" r="0" b="0"/><wp:docPr id="99" name="Foto"/><wp:cNvGraphicFramePr><a:graphicFrameLocks xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" noChangeAspect="1"/></wp:cNvGraphicFramePr><a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:nvPicPr><pic:cNvPr id="99" name="Foto"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="${newRid}"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${SHAPE_CX}" cy="${SHAPE_CY}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r>`;

  // Replace the entire <w:p>...</w:p> paragraph that contains &lt;Foto&gt;
  // An image CANNOT live inside <w:r><w:t> — it must replace the whole paragraph.
  // We find the paragraph boundaries manually to avoid greedy regex issues.
  const fotoMatch = /&lt;foto&gt;/i.exec(xml);
  const fotoToken = fotoMatch ? fotoMatch[0] : null;
  const fotoIdx = fotoToken ? fotoMatch.index : -1;
  if (fotoIdx !== -1) {
    // Walk backwards to find the opening <w:p
    const pOpen = xml.lastIndexOf("<w:p ", fotoIdx) !== -1
      ? xml.lastIndexOf("<w:p ", fotoIdx)
      : xml.lastIndexOf("<w:p>", fotoIdx);
    // Find the closing </w:p> after the token
    const pClose = xml.indexOf("</w:p>", fotoIdx) + "</w:p>".length;
    const newPara = '<w:p><w:pPr><w:jc w:val="center"/></w:pPr>' + drawing + '</w:p>';
    xml = xml.slice(0, pOpen) + newPara + xml.slice(pClose);
  }

} else {

  // Remove placeholder paragraph if no photo
  const fotoMatch2 = /&lt;foto&gt;/i.exec(xml);
  const fotoToken2 = fotoMatch2 ? fotoMatch2[0] : null;
  const fotoIdx2 = fotoToken2 ? fotoMatch2.index : -1;
  if (fotoIdx2 !== -1) {
    const pOpen2 = xml.lastIndexOf("<w:p ", fotoIdx2) !== -1
      ? xml.lastIndexOf("<w:p ", fotoIdx2)
      : xml.lastIndexOf("<w:p>", fotoIdx2);
    const pClose2 = xml.indexOf("</w:p>", fotoIdx2) + "</w:p>".length;
    xml = xml.slice(0, pOpen2) + xml.slice(pClose2);
  }

}

zip.file("word/document.xml", xml);

    // 5. Generate and download
    const blob = await zip.generateAsync({ type: 'blob', mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href     = url;
    const sheetNames = { tu: 'Paneli TU', kabine: 'Kabina Elektrike', rrufeprites: 'Rrufeprites' };
    a.download = 'Protokoll Tokezimi ' + sheetNames[selectedSheet] + ' ' + objekti + '.docx';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    showStatus('✅ Dokumenti u gjenerua dhe u shkarkua me sukses!', 'success');
  } catch (err) {
    console.error(err);
    showStatus('❌ Gabim gjatë gjenerimit: ' + err.message, 'error');
  } finally {
    btn.disabled   = false;
    btn.textContent = '📄 Gjenero & Shkarko Protokollin (.docx)';
  }
}

document.getElementById('data').valueAsDate = new Date();
</script>
</body>
</html>
